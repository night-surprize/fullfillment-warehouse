name: Database tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_USER: warehouse_test
          POSTGRES_PASSWORD: local_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse_test -d warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://warehouse_test:local_test_password@localhost:5432/warehouse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install -r python/requirements.txt
      - run: python tests/run_integration.py
